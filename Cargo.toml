[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]

# Internal crates
bookeeping-core = { path = "crates/core" }
bookeeping-backend = { path = "crates/backend" }
bookeeping-frontend = { path = "crates/frontend" }

# External Crates
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"